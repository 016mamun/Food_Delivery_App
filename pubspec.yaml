name: food_delivery
description: "Food Delivery App - User, Restaurant & Rider"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  firebase_analytics: ^11.3.3

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Maps & Location
  google_maps_flutter: ^2.9.3
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Payment
  flutter_stripe: ^11.3.0

  # Network
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.1

  # Storage & Utils
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  connectivity_plus: ^6.1.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  timeago: ^3.7.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.14
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
